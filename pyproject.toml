[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pegasus-data"
version = "0.2.0"
description = "DATASUS + SIDRA data substrate for PegaSUS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "tenacity>=8.2.3",
  "rapidfuzz>=3.9.0",
  "dbfread>=2.0.7",
  "datasus-dbc>=0.1.3",
]

[project.scripts]
pegasus-data = "pegasus_data.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
